# build · research: the papers, patents and abstracts, newest first (the page keeps this order).
# One entry is one publication. To add one, copy an entry to its place by year and change its fields:
#   title, year, venue, kind (paper, patent or abstract), authors (as published), links (each a type: paper, arxiv,
#   github or data, and its href; patent or pdf only on a hidden entry: the page has no word for them), hidden: true
#   to keep it off the page (and out of its source).
# Optional: tier: featured pins it on top, beside the software it names in software: (a title in software.yaml);
#   tier: more marks a paper kept off the page for now. img: a picture in img/ beside this file, with its alt text.
# 中文提示：一条就是一篇论文、专利或摘要，按年份从新到旧；复制一条再改字段，hidden: true 就不显示。

