# build · software: the shelf, in the page's order (the featured one, which research.yaml pairs with its paper, stands
# on top instead). One entry is one piece of software. To add one, copy an entry and change its fields:
#   title, year, line (the one line its card shows), technologies (as the page writes them), links (each a type:
#   github, app, paper, arxiv or data, and its href).
# Optional: description (the longer text: the card shows it where there is no line), status (active or archived),
#   version, post (a post of this blog about it: its folder under content/blog/; a "blog" link after the others),
#   img (a picture in img/) with its alt text, pos and to (where a wide picture rests and where it travels to, as
#   "0% 50%"), fit: mark (a logo, small and whole), film (a moving picture in img/, played while the card is in hand).
# 中文提示：一条就是一个软件；line 是卡片上显示的那一行字，图片放在 img/ 里。

# Waycine (r14, the owner, 2026-10-15): created 2026-10-12, public, MIT; its app is its own repository's Pages at
# /waycine/ (not this site's). The still and the moving demo are his own files (its docs/media/ and its README).
- title: Waycine
  year: 2026
  line: Turns a list of stops into an animated map video of a trip, tour or race season.
  description: Waycine (“way cinema”) turns a list of stops into an animated travel map video of your trip, road trip, tour or race season.
  status: active
  technologies: [ TypeScript, Preact, Node.js ]
  links:
    - { type: github, href: https://github.com/zhenyuanlu/waycine }
    - { type: app, href: https://zhenyuanlu.com/waycine/ }
  img: ./img/waycine-season-poster.png
  alt: "Waycine’s season poster: a dark map of a race season, 7 races, 5 states, 4 months"
  pos: 50% 50%
  to: 50% 50%
  film: ./img/demo-race-season.webp

