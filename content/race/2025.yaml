# race · the 2025 season: one entry is one race, in date order.
# To add one, copy an entry and change its fields:
#   id (lowercase with hyphens, unique across the seasons: the race's address, /race/#<id>; never next, a year or
#   the name of another venue on the map), date (YYYY-MM-DD; or
#   YYYY-MM/MM while only the months are known), end (the last day of a race over days), sport (run, hyrox or
#   dragonboat), name, short and tiny (shorter names, for the home's race line), place, lat and lon (the venue;
#   approx: true where they are rough), water (the river or lake), status (raced once run; registered or planned
#   before), results (each an event and a place, or finisher: true, or qualified: true; a note), crews (each a name,
#   a note, club: an id in clubs.yaml, a division), medley (its leg of the series in medley.yaml: 1, 2 or 3), weather
#   (sun, sun-cloud, cloud, overcast-wind or rain: his word for the venue's day), note.
# 中文提示：一条就是一场比赛，按日期排；比完把 status 改成 raced，再填 results。

